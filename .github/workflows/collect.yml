name: collect-gbfs

# Every 15 minutes: snapshot every public GBFS system and attach the files to a
# per-day GitHub Release (data-YYYY-MM-DD), so the repository itself stays small.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect-gbfs
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: collector

      - name: Restore discovery cache
        uses: actions/cache/restore@v4
        with:
          path: data/state
          key: discovery-${{ github.run_id }}
          restore-keys: discovery-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Snapshot all systems
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data
          tag="data-$(date -u +%Y-%m-%d)"
          skip=""
          if gh release view "$tag" --json assets -q '.assets[].name' 2>/dev/null | grep -q '^static_'; then
            skip="--skip-static"
          fi
          python -I collector/collect.py --out data $skip | tee data/run.json

      - name: Save discovery cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/state
          key: discovery-${{ github.run_id }}

      - name: Attach snapshot to the day's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          day=$(date -u +%Y-%m-%d)
          tag="data-$day"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "GBFS snapshots $day (UTC)" \
              --notes "15-minute snapshots of public GBFS station_status feeds. Raw, uncleaned. See README." --latest=false
          files=$(find data/raw data/static -name '*.csv.gz' -type f)
          for f in $files; do
            # flatten the path into the asset name: raw_2026_11_14_1735_status.csv.gz
            name=$(echo "${f#data/}" | tr '/' '_')
            cp "$f" "$name"
            gh release upload "$tag" "$name" --clobber
          done
